
name: Shell Command Practice

on: workflow_dispatch

jobs:
  shell-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "Current directory:"
          pwd
          echo "File list:"
          ls -la

      - name: Check file
        run: |
          if [ -f "README.md" ]; then
            echo "README.md file exists"
          else
            echo "README.md file not found"
          fi

      - name: Repeat commands
        run: |
          for i in 1 2 3 4 5
          do
            echo "GitHub Actions Practice $i"
          done

      - name: Use environment variable
        env:
          MESSAGE: "SunDowon GitHub Actions Practice"
        run: echo "$MESSAGE"
