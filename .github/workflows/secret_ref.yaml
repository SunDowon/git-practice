
name: Secrets

on: workflow_dispatch

jobs:
  print:
    runs-on: ubuntu-latest
    env:
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Check Secret
        run: |
          if [ -n "$PASSWORD" ]; then
            echo "PASSWORD secret is configured"
          else
            echo "PASSWORD secret is missing"
            exit 1
          fi

      - name: Demonstrate Masking
        run: |
          echo "::add-mask::$PASSWORD"
          echo "Secret value: $PASSWORD"
